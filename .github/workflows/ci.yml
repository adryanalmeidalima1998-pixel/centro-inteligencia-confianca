name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Repository checks
        run: npm run check:all

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-only-secret-not-used-in-production
          AUTH_EMAIL: ci@local.test
          AUTH_PASSWORD: ci-only-password
          NEXT_TELEMETRY_DISABLED: 1
